<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2997ff"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Outer Border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Logo Icon -->
  <g transform="translate(100, 110) scale(3.5)" fill="none" stroke="#2997ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12 2 2 7 12 12 22 7 12 2"/>
    <polyline points="2 17 12 22 22 17"/>
    <polyline points="2 12 12 17 22 12"/>
  </g>
  
  <!-- Title & Text -->
  <text x="210" y="165" font-family="-apple-system, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">QR3D Studio</text>
  <text x="500" y="160" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#2997ff" letter-spacing="1">3MF MULTICOLOR</text>

  <text x="100" y="275" font-family="-apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Generador de Códigos QR</text>
  <text x="100" y="340" font-family="-apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-1.5">para Impresión 3D</text>

  <text x="100" y="415" font-family="-apple-system, sans-serif" font-size="24" fill="#a1a1a6">Soportes de mesa, llaveros y placas con relieve táctil y color nativo.</text>

  <!-- Badges -->
  <g transform="translate(100, 480)">
    <rect width="260" height="54" rx="27" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="130" y="34" font-family="-apple-system, sans-serif" font-size="18" font-weight="600" fill="#f5f5f7" text-anchor="middle">🎨 .3MF Multicolor</text>
  </g>
  <g transform="translate(380, 480)">
    <rect width="260" height="54" rx="27" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="130" y="34" font-family="-apple-system, sans-serif" font-size="18" font-weight="600" fill="#f5f5f7" text-anchor="middle">📦 .STL Universal</text>
  </g>
  <g transform="translate(660, 480)">
    <rect width="260" height="54" rx="27" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="130" y="34" font-family="-apple-system, sans-serif" font-size="18" font-weight="600" fill="#f5f5f7" text-anchor="middle">🔒 100% Client-Side</text>
  </g>
</svg>
